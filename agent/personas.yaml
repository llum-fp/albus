# Profiles as CONFIG, not code. The spec fixes three end-user profiles: Sales / Technical / CSM.
# The course generator (and Audience Adapter step) consume this to shape a course for its profile.

profiles:
  sales:
    label: Sales
    emphasis: >
      The value proposition, why the customer buys, competitive differentiation,
      objection handling, and customer use cases.
    avoid: deep configuration internals
    tone: persuasive, benefit-led, plain language
  technical:
    label: Technical
    emphasis: >
      How the product/service works, architecture, configuration steps, procedures,
      common failure modes and troubleshooting.
    avoid: marketing fluff
    tone: precise, hands-on
  csm:
    label: Customer Service Manager
    emphasis: >
      Processes, SLAs, escalation paths, client communication, and incident management.
    avoid: low-level engineering detail
    tone: process-oriented, customer-facing

levels:
  beginner: { assumes: no prior knowledge, depth: foundational concepts only }
  intermediate: { assumes: working familiarity, depth: practical detail and examples }
  advanced: { assumes: expert, depth: edge cases, internals, optimisation }
